# Teste temporário: confere se uma assinatura própria funciona no Mac do GitHub.
name: Teste de assinatura
on:
  push:
    paths: ['.github/workflows/teste-assinatura.yml']
jobs:
  teste:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar certificado de teste
        run: |
          cd "$RUNNER_TEMP"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=v3\nprompt=no\n[dn]\nCN=Goat Meet Teste\n[v3]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > c.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 30 -config c.cnf
          openssl pkcs12 -export -inkey k.pem -in c.pem -name "Goat Meet Teste" -out a.p12 -passout pass:teste123 -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
      - name: Importar no chaveiro
        run: |
          KC="$RUNNER_TEMP/goat.keychain-db"
          security create-keychain -p teste123 "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p teste123 "$KC"
          security import "$RUNNER_TEMP/a.p12" -k "$KC" -P teste123 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k teste123 "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
      - name: Montar e assinar
        run: GOAT_ASSINATURA="Goat Meet Teste" bash _app/build.sh --verificar
      - name: Conferir identidade fixa
        run: |
          codesign -d -r- "_app/build/Goat Meet.app" 2>&1 | tee req.txt
          grep -q "certificate leaf" req.txt
      - name: Conferir assinatura valida
        run: codesign --verify --strict "_app/build/Goat Meet.app"
