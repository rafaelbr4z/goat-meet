<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goat Meet</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:var(--t-body);-webkit-font-smoothing:antialiased;overflow:hidden;cursor:default;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:var(--ink);color:var(--inverse-text)}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.26);border:3px solid transparent;background-clip:content-box}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,74,43,.5)}60%{box-shadow:0 0 0 7px rgba(255,74,43,0)}}
@keyframes blink{50%{opacity:.25}}

/* ---------- componentes base ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:44px;padding:0 var(--s5);border-radius:var(--r-pill);background:var(--fill);font:var(--t-label);color:var(--ink);white-space:nowrap;transition:background .15s,transform .12s}
.btn:hover{background:var(--fill-hover)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--inverse-text)} .btn.pri:hover{background:var(--inverse-fill)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{font:500 16px/1.2 var(--font-text);color:var(--ink);padding:0;text-align:left}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.quiet{font:var(--t-meta);color:var(--muted);padding:6px 8px;border-radius:var(--r-sm)}
.quiet:hover{color:var(--ink)} .quiet.danger:hover{color:var(--signal)}
.badge{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--inverse-text);display:grid;place-items:center;flex:none}
.meta{font:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.people{display:flex;align-items:center;gap:10px;font:400 17px/1.2 var(--font-text);color:var(--ink);min-height:32px}
.people.none{color:var(--muted)}
.avs{display:flex}
.av{width:32px;height:32px;border-radius:50%;background:var(--fill-hover);border:2px solid var(--surface);margin-left:-9px;display:grid;place-items:center;font:600 11px/1 var(--font-text);color:var(--text)}
.av:first-child{margin-left:0;background:var(--ink);color:var(--inverse-text)}

/* ---------- barra de cima (sem trilho lateral) ---------- */
.top{position:absolute;left:0;right:0;top:0;height:92px;padding:34px var(--s8) 0;display:flex;align-items:flex-start;gap:var(--s4);z-index:2}
.brand{height:44px;display:flex;align-items:center;font:500 18px/1 var(--font-display);letter-spacing:-.01em;padding-right:var(--s3);white-space:nowrap}
.back{width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.back:hover{background:var(--fill-hover)}
.search{position:relative;flex:1;max-width:420px}
.top .sp{flex:1}
.search input{width:100%;height:44px;border:0;background:none;padding:0 var(--s4) 0 28px;outline:none;font:400 16px/1 var(--font-text);-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:0;top:15px;color:var(--muted)}
.recbtn,.gear,.calbtn{position:absolute;right:var(--edge);z-index:4;width:var(--fab);height:var(--fab);border-radius:50%;color:var(--inverse-text);display:grid;place-items:center;box-shadow:var(--shadow-lift);transition:transform .18s,background .15s,filter .15s}
.recbtn{bottom:calc(var(--edge) + 2 * (var(--fab) + var(--fab-gap)));background:var(--signal)}
.calbtn{bottom:calc(var(--edge) + var(--fab) + var(--fab-gap));background:var(--ink)}
.calbtn:hover{background:var(--inverse-fill);transform:scale(1.06)} .calbtn:active{transform:scale(.96)}
.gear,.calbtn{z-index:9}
.calbtn.open svg{transform:scale(1.12)} .calbtn svg{transition:transform .2s}
.calbtn.soon::after{content:"";position:absolute;right:1px;top:1px;width:13px;height:13px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 3px var(--bg)}
.recbtn:hover{filter:brightness(1.08);transform:scale(1.06)} .recbtn:active{transform:scale(.96)}
.recbtn i{width:14px;height:14px;border-radius:4px;background:var(--inverse-text)}
.recbtn.on{animation:pulse 1.4s infinite}
.recbtn[disabled]{opacity:.45;pointer-events:none}
.gear{bottom:var(--edge);background:var(--ink)}
.gear:hover{background:var(--inverse-fill);transform:scale(1.06)} .gear:active{transform:scale(.96)}
.gear svg{transition:transform .35s}
.gear:hover svg{transform:rotate(60deg)}


/* ---------- área de conteúdo ---------- */
.view{position:absolute;inset:92px 0 0 0;overflow-y:auto;padding:0 var(--s8) 170px}
.wrap{max-width:none}
.page{font:var(--t-page);letter-spacing:-.03em;margin:var(--s5) 0 var(--s3)}
.today{font:var(--t-lead);color:var(--text);margin-bottom:var(--s7)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--s5);padding-bottom:var(--s3)}

/* cartão de reunião */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s6);display:flex;flex-direction:column;min-height:376px;cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .2s}
.card.entra{animation:in .4s both}
.card:hover{--surface:var(--inverse-surface);--ink:var(--inverse-text);--text:var(--inverse-body);--muted:var(--inverse-muted);--fill:var(--inverse-fill);--fill-hover:var(--inverse-fill-hover);transform:translateY(-6px);background:var(--inverse-surface);border-color:var(--inverse-surface);color:var(--inverse-text);box-shadow:var(--shadow-float)}
.card,.card h3,.card .badge,.card .btn,.card .av,.card .sum,.card .meta,.card .people,.card .link{transition:background-color .22s,color .22s,border-color .22s,transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
.card:hover .badge,.card:hover .av:first-child,.card:hover .btn.pri{color:var(--inverse-surface)}
.card:hover .btn.pri:hover{background:var(--inverse-press)}
.card:active{transform:translateY(-2px)}
.badge svg rect{transform-box:fill-box;transform-origin:center}
.card:hover .badge svg rect{animation:eq .9s ease-in-out infinite}
.card:hover .badge svg rect:nth-child(2){animation-delay:-.2s}
.card:hover .badge svg rect:nth-child(3){animation-delay:-.45s}
.card:hover .badge svg rect:nth-child(4){animation-delay:-.1s}
.card:hover .badge svg rect:nth-child(5){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
.card .link{position:relative}
.card .link::after{content:"→";display:inline-block;margin-left:6px;opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .25s}
.card:hover .link::after{opacity:1;transform:none}
.card .toprow{display:flex;justify-content:space-between;align-items:flex-start}
.card h3{font:var(--t-title);letter-spacing:-.01em;margin-top:var(--s5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .people{margin-top:var(--s3)}
.card .row{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4)}
.card .row .meta{margin-left:auto}
.card .sum{font:var(--t-body);color:var(--text);margin-top:var(--s4);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .sum.none{color:var(--muted)}
.card .sum .run{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal);margin-right:8px;animation:blink 1s infinite}
.card .link{margin-top:auto;padding-top:var(--s4)}

/* reunião aberta: tela inteira, coluna centralizada, sem moldura */
.sheet{max-width:800px;margin:var(--s4) auto 0;animation:in .35s both;-webkit-user-select:text;user-select:text;cursor:auto}
.sheet>.meta{display:block;-webkit-user-select:none;user-select:none}
.title{font:var(--t-display);letter-spacing:-.025em;margin-top:var(--s3);outline:none;cursor:text;border-radius:var(--r-sm)}
.title:focus{box-shadow:0 0 0 8px var(--bg),0 0 0 9px var(--border)}
.sheet .people{margin-top:var(--s5)}
.cal{display:inline-flex;align-items:center;gap:8px;margin-top:var(--s4);height:34px;padding:0 14px 0 12px;border-radius:var(--r-pill);background:var(--fill);font:500 14px/1 var(--font-text);color:var(--ink);font-variant-numeric:tabular-nums;transition:background .15s}
.cal:hover{background:var(--fill-hover)}
.cal span{color:var(--text);font-weight:400}
.switch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:400 15px/1.4 var(--font-text);color:var(--ink);padding:6px 0}
.switch i{flex:none;width:40px;height:24px;border-radius:var(--r-pill);background:var(--fill-hover);position:relative;transition:background .18s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--inverse-text);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch.on i{background:var(--ink)} .switch.on i::after{transform:translateX(16px)}
.tabs{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-top:var(--s6);padding-bottom:var(--s6);border-bottom:1px solid var(--border);-webkit-user-select:none;user-select:none}
.tabs .sp{flex:1}
.pane{padding-top:var(--s6);animation:in .3s both}
.ask{margin-top:var(--s7);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s6);-webkit-user-select:none;user-select:none;cursor:default}
.ask h4{font:var(--t-title);letter-spacing:-.01em;color:var(--ink)}
.ask p{font:var(--t-body);color:var(--text);margin-top:6px}
.ask .row{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s5)}

.md{font:var(--t-body);color:var(--text)}
.md h1{display:none}
.md h2{font:var(--t-heading);color:var(--ink);margin:var(--s7) 0 var(--s3);padding-top:var(--s6);border-top:1px solid var(--border)}
.md h2:first-child{margin-top:0;padding-top:0;border-top:0}
.md h3{font:600 15px/1.4 var(--font-text);color:var(--ink);margin:var(--s5) 0 6px}
.md p{margin:0 0 var(--s3)}
.md blockquote{font:var(--t-lead);color:var(--text);margin:0 0 6px}
.md blockquote p{margin:0}
.md ul,.md ol{margin:0 0 var(--s3);list-style:none}
.md li{position:relative;padding-left:20px;margin:7px 0}
.md ul>li::before{content:"";position:absolute;left:5px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.md ol{counter-reset:n}.md ol>li{counter-increment:n}
.md ol>li::before{content:counter(n) ".";position:absolute;left:0;top:0;color:var(--muted);font-variant-numeric:tabular-nums}
.md li.todo{padding-left:34px;display:flex;align-items:baseline;gap:var(--s3);cursor:pointer;border-radius:10px}
.md li.todo .tx{flex:1;min-width:0}
.md li.todo:hover::before{box-shadow:inset 0 0 0 1.5px var(--ink)}
.md li.todo::before{left:0;top:.14em;width:22px;height:22px;border-radius:50%;background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.md li.todo.done{color:var(--muted)}
.md li.todo.done::before,.md li.todo.done:hover::before{background:var(--ink);box-shadow:none}
.md li.todo.done .tx strong{color:var(--muted)}
.md li.todo.done::after{content:"";position:absolute;left:7px;top:.56em;width:8px;height:4px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg)}
.due{flex:none;font:500 12.5px/1 var(--font-text);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--fill);padding:5px 10px;border-radius:var(--r-pill);white-space:nowrap;transition:background .15s,color .15s,opacity .15s}
.due:hover{background:var(--fill-hover)}
.due.none{background:none;color:var(--muted);opacity:0}
.md li.todo:hover .due.none,.due.none:focus{opacity:1}
.due.late{background:none;box-shadow:inset 0 0 0 1.5px var(--signal);color:var(--signal)}
.md li.todo.done .due{color:var(--muted);background:none;box-shadow:none}
.duein{flex:none;font:500 12.5px/1 var(--font-text);border:0;background:var(--fill);border-radius:var(--r-pill);padding:4px 10px;outline:none;color:var(--ink)}
.md strong{font-weight:600;color:var(--ink)}
.md em{font-style:italic}
.md code{font:13px ui-monospace,Menlo,monospace;background:var(--fill);padding:1px 6px;border-radius:6px;color:var(--ink)}
.md hr{border:0;height:1px;background:var(--border);margin:var(--s6) 0}
.md a.ts{font:500 12.5px/1 var(--font-text);font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none;background:var(--fill);padding:4px 9px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;margin-left:2px;transition:background .15s,color .15s}
.md a.ts:hover{background:var(--ink);color:var(--inverse-text)}
.md table{border-collapse:collapse;width:100%;margin:0 0 var(--s4);font-size:14.5px}
.md th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.md td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}

.turn{padding:var(--s4) 0}
.turn+.turn{border-top:1px solid var(--border)}
.who{display:flex;align-items:baseline;gap:10px;font:600 14px/1.4 var(--font-text);color:var(--text);margin-bottom:3px}
.who time{font-weight:400;font-size:13px;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.who time:hover{color:var(--ink)}
.turn.eu .who{color:var(--ink)}
.say{font:var(--t-body);color:var(--text)}
.say span{border-radius:5px;cursor:pointer;transition:background .15s}
.say span:hover{background:var(--fill)}
.say span.now{background:var(--fill-hover);color:var(--ink);box-shadow:0 0 0 2px var(--fill-hover)}

.empty{max-width:440px;margin:6vh auto 0;text-align:center;color:var(--text);cursor:default;-webkit-user-select:none;user-select:none;animation:in .4s both}
.empty.in{margin:var(--s7) auto var(--s4)}
.empty h3{font:var(--t-title);color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
.empty .badge{margin:0 auto var(--s6)}
.empty .btn{margin-top:var(--s6)}
.hint{font:var(--t-meta);color:var(--muted);margin-top:var(--s3)}

/* ---------- doca: gravador e player (superfície invertida) ---------- */
.dock{position:absolute;right:var(--float-x);bottom:var(--edge);z-index:4;width:436px;max-width:calc(100vw - 56px);background:var(--ink);color:var(--inverse-text);border-radius:var(--r-dock);padding:18px 22px 20px;box-shadow:var(--shadow-float);animation:in .3s both}
.dock[hidden]{display:none}
.dock.wide{left:0;right:0;margin:0 auto;width:min(800px,calc(100vw - 232px));max-width:none;padding:16px 22px 16px 16px}
.dock-head{display:flex;align-items:center;gap:10px;font:500 16px/1.2 var(--font-text);margin-bottom:14px}
.dock-head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-head .sp{flex:1}
.dock-head time{font-variant-numeric:tabular-nums}
.dock-head .x{color:var(--inverse-muted);font-size:20px;line-height:1;padding:0 2px}
.dock-head .x:hover{color:var(--inverse-text)}
.dock-head .live{width:9px;height:9px;border-radius:50%;background:var(--signal);animation:pulse 1.2s infinite;flex:none}
.dock-row{display:flex;align-items:center;gap:14px}
.play{width:36px;height:36px;border-radius:50%;background:var(--inverse-text);color:var(--ink);display:grid;place-items:center;flex:none}
.play:hover{background:var(--inverse-press)}
.bar{flex:1;height:30px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.bar i{width:3px;height:6px;border-radius:3px;background:var(--inverse-track);flex:none;transition:background .12s}
.bar i.on{background:var(--inverse-text)}
.dock-row time{font:500 16px/1 var(--font-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{font:500 16px/1 var(--font-text);color:var(--inverse-text);min-width:30px;text-align:right}
.speed:hover{color:var(--inverse-text)}
.meters{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;margin-bottom:18px}
.meters label{font:var(--t-meta);color:var(--inverse-muted)}
.meter{height:6px;border-radius:6px;background:var(--inverse-fill);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:var(--inverse-text);transition:width .09s linear}
.dock input{flex:1;min-width:0;height:40px;border-radius:var(--r-pill);border:0;background:var(--inverse-fill);color:var(--inverse-text);padding:0 var(--s4);outline:none;font:400 15px/1 var(--font-text);-webkit-user-select:text;user-select:text}
.dock input::placeholder{color:var(--inverse-muted)}
.dock input:focus{background:var(--inverse-fill-hover)}
.dock .stop{height:40px;padding:0 18px;border-radius:var(--r-pill);background:var(--inverse-text);color:var(--ink);font:var(--t-label);display:flex;align-items:center;gap:9px;flex:none}
.dock .stop:hover{background:var(--inverse-press)}
.dock .stop::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--ink)}
.dock .warn{font:var(--t-meta);color:var(--signal-soft);margin:-6px 0 14px}

.veil{position:absolute;inset:0;z-index:8}
.veil[hidden]{display:none}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}
.pop{position:absolute;right:var(--float-x);bottom:var(--edge);width:400px;max-width:calc(100vw - 120px);max-height:calc(100vh - 56px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-dock);padding:10px;box-shadow:var(--shadow-float);transform-origin:100% 100%}
.pop.abre{animation:pop .22s cubic-bezier(.2,.9,.3,1.15) both}
.pop-head{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px 6px;font:var(--t-heading)}
.pop-head .bk{width:32px;height:32px;margin-left:-6px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;transition:background .15s}
.pop-head .bk:hover{background:var(--fill-hover)}
.pop-head .state{margin-left:auto}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border-radius:var(--r-row);font:400 16px/1.2 var(--font-text);color:var(--ink);text-align:left;transition:background .15s;cursor:pointer}
.prow:hover{background:var(--fill)}
.prow .v{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.prow .v svg{color:var(--muted)}
.prow input{margin-left:auto;width:170px;height:36px;border:0;border-radius:var(--r-pill);background:none;padding:0 12px;text-align:right;outline:none;font:400 15px/1 var(--font-text);color:var(--text);-webkit-user-select:text;user-select:text}
.prow input:focus{background:var(--fill-hover);color:var(--ink)}
.pop-body{padding:0 12px 10px}
.pop-body p{font:400 14.5px/1.5 var(--font-text);color:var(--text)}
.pop-body .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s4)}
.pop-body .in{flex:1;min-width:0;height:44px;border-radius:var(--r-pill);border:0;background:var(--fill);padding:0 var(--s4);outline:none;font:400 15px/1 var(--font-text);-webkit-user-select:text;user-select:text}
.pop-body .in:focus{background:var(--fill-hover)}
.pop-body .switch{margin-top:var(--s3);padding:0}
.pop-body .row+.switch{margin-top:var(--s5)}
.pop-body .switch small{display:block;font:400 13px/1.4 var(--font-text);color:var(--text);margin-top:2px}
.pop-head .dia{margin-left:auto;font:var(--t-meta);color:var(--muted)}
.pop-lab{padding:14px 12px 4px;font:500 12.5px/1 var(--font-text);color:var(--muted)}
.ev{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 12px;border-radius:var(--r-row)}
.ev time{flex:none;width:44px;font:500 15px/1 var(--font-text);font-variant-numeric:tabular-nums;color:var(--ink)}
.ev .tx{min-width:0;flex:1}
.ev .tx b{display:block;font:500 15.5px/1.25 var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tx small{display:block;margin-top:4px;font:400 13px/1.2 var(--font-text);color:var(--text);font-variant-numeric:tabular-nums}
.ev .btn{height:36px;padding:0 16px;font-size:14px;flex:none}
.ev .q{flex:none;font:400 13px/1 var(--font-text);color:var(--muted)}
.ev.now{background:var(--fill)}
.ev.past time,.ev.past .tx b{color:var(--text)}
.pop-empty{padding:18px 12px 22px;font:400 15px/1.5 var(--font-text);color:var(--text)}
.pop-sep{height:1px;background:var(--border);margin:6px 12px}

<script>
// ---------- ponte com o app (Swift) ----------
const nativo = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.goat;
let seqChamada = 0;
const pendentes = {};
window.goatResposta = function (n, valor) { const f = pendentes[n]; delete pendentes[n]; if (f) f(valor); };
function chamar(cmd, args) {
  if (!nativo) return Promise.resolve(simulado(cmd, args || {}));
  return new Promise((ok) => {
    const n = ++seqChamada;
    pendentes[n] = ok;
    setTimeout(() => { if (pendentes[n]) { delete pendentes[n]; ok(null); } }, 20000);
    nativo.postMessage(Object.assign({ cmd: cmd, n: n }, args || {}));
  });
}

// ---------- estado ----------
const S = { lista: [], sel: null, det: null, aba: 'minuta', q: '', gravando: false, inicio: 0, micOk: true, tituloNovo: '', ocupado: false, som: null, prox: null, tituloPend: '', pop: null, agenda: [], proj: null, projetos: [], projDet: {}, marc: new Set(), menu: null, armado: false, editar: false, setup: null };
const $ = (s) => document.querySelector(s);
// No app, quem toca o áudio é o próprio Mac (funciona com a pasta em qualquer disco). Este objeto imita o player da página.
function somNativo() {
  const ouv = {};

  const emite = (n) => (ouv[n] || []).slice().forEach((f) => f());

    addEventListener(n, f, op) {
      const l = (ouv[n] = ouv[n] || []);

    },

    get duration() { return dur; },
    get readyState() { return pronto ? 4 : 0; },
    get currentTime() { return t; },
    set currentTime(v) { t = Math.max(0, v); chamar('som', { acao: 'ir', t: t }); emite('timeupdate'); },
    get playbackRate() { return vel; },
    set playbackRate(v) { vel = v; chamar('som', { acao: 'velocidade', v: v }); },
    get src() { return id; },
    set src(v) {
      id = v; pronto = false; t = 0; dur = 0; tocando = false;
      chamar('som', { acao: 'carregar', id: v }).then((r) => { if (id !== v) return; if (r && r.ok) { dur = r.dur; pronto = true; emite('loadedmetadata'); } else { aviso('Não consegui abrir o áudio desta reunião.'); } });
    },
    removeAttribute() { id = null; pronto = false; tocando = false; t = 0; chamar('som', { acao: 'parar' }); },
    play() { if (!id) return; tocando = true; pediuTocar = Date.now(); emite('play'); chamar('som', { acao: 'tocar', v: vel }); },
    pause() { if (!tocando) return; tocando = false; emite('pause'); chamar('som', { acao: 'pausar' }); },
    evento(e) {
      t = e.t || 0; if (e.dur) dur = e.dur;
      // um aviso de "parado" que chega logo depois de mandar tocar é atraso da resposta, não uma pausa
      const antes = tocando;
      if (e.tocando || e.fim || Date.now() - pediuTocar > 900) tocando = !!e.tocando;
      emite('timeupdate');
      if (antes !== tocando) emite(tocando ? 'play' : (e.fim ? 'ended' : 'pause'));
    }
  };
}

// ---------- markdown da minuta ----------
function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]/g, '<a class="ts" data-t="$1">$1</a>')
    .replace(/\{\?([^}]+)\}/g, '<span class="duv" data-duv title="O Claude não tem certeza deste nome. Clique para corrigir.">$1</span>');
}
const RE_TAREFA = /^\s*[-*]\s+\[( |x|X)\]\s+/;
const RE_PRAZO = /\s*\(prazo:\s*([^)]*)\)/i;
function dataDoPrazo(t) {
  const m = String(t).trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (!m) return null;
  const ano = m[3] ? (m[3].length === 2 ? 2000 + (+m[3]) : +m[3]) : new Date().getFullYear();
  return new Date(ano, +m[2] - 1, +m[1]);
}
function tarefaHtml(t, feita, n) {
  const pm = t.match(RE_PRAZO);
  const texto = pm ? t.replace(RE_PRAZO, '') : t;
  const prazo = pm ? pm[1].trim() : '';
  const d = prazo ? dataDoPrazo(prazo) : null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const atrasada = d && !feita && d < hoje;
  return '<li class="todo' + (feita ? ' done' : '') + '" data-n="' + n + '"><span class="tx">' + inline(texto) + '</span>'
    + '<button class="due' + (prazo ? (atrasada ? ' late' : '') : ' none') + '" data-due="' + n + '" title="Definir prazo">' + (prazo ? esc(prazo) : '+ prazo') + '</button></li>';
}
function markdown(src) {
  const L = String(src || '').replace(/\r/g, '').split('\n');
  let h = '', i = 0, par = [], nTarefa = 0;
  const fecha = () => { if (par.length) { h += '<p>' + inline(par.join(' ')) + '</p>'; par = []; } };
  while (i < L.length) {
    const l = L[i];
    let m;
    if (!l.trim()) { fecha(); i++; continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { fecha(); if (m[1].length === 2 && /^projeto$/i.test(m[2].trim())) { i++; while (i < L.length && !/^##\s/.test(L[i])) i++; continue; } h += '<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { fecha(); h += '<hr>'; i++; continue; }
    if (/^>\s?/.test(l)) { fecha(); const b = []; while (i < L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/, '')); h += '<blockquote><p>' + inline(b.join(' ')) + '</p></blockquote>'; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
      fecha();
      const cel = (x) => x.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      h += '<table><thead><tr>' + cel(l).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) h += '<tr>' + cel(L[i++]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      h += '</tbody></table>'; continue;
    }
    if (/^\s*([-*]|\d+[.)])\s+/.test(l)) {
      fecha();
      const ord = /^\s*\d+[.)]\s+/.test(l);
      h += ord ? '<ol>' : '<ul>';
      while (i < L.length && /^\s*([-*]|\d+[.)])\s+/.test(L[i])) {
        let t = L[i++].replace(/^\s*([-*]|\d+[.)])\s+/, '');
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*]|\d+[.)])\s+/.test(L[i])) t += ' ' + L[i++].trim();
        const c = t.match(/^\[( |x|X)\]\s+(.*)$/);
        h += c ? tarefaHtml(c[2], c[1] !== ' ', nTarefa++) : '<li>' + inline(t) + '</li>';
      }
      h += ord ? '</ol>' : '</ul>'; continue;
    }
    par.push(l.trim()); i++;
  }
  fecha();
  return h;
}

function eventoHtml(e, i, agora) {
  const ini = new Date(e.inicio).getTime(), fim = new Date(e.fim).getTime();
  const min = Math.round((fim - ini) / 60000);
  let cls = '', acao, apoio = hora(new Date(ini)) + ' às ' + hora(new Date(fim));
  if (e.reuniaoId) { cls = ' past'; apoio = (e.criadoPeloApp ? 'Registrada pelo app · ' : 'Gravada · ') + duracao(min * 60); acao = '<button class="btn" data-ev-abrir="' + esc(e.reuniaoId) + '">Abrir</button>'; }
  else if (agora >= ini - 10 * 60000 && agora < fim) { cls = ' now'; apoio = agora < ini ? 'Começa em ' + Math.max(1, Math.round((ini - agora) / 60000)) + ' min' : 'Acontecendo agora'; acao = '<button class="btn pri" data-ev-gravar="' + i + '">Gravar</button>'; }
  else if (agora < ini) { const m = Math.round((ini - agora) / 60000); acao = '<span class="q">' + (e.amanha ? '' : 'em ' + (m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : ''))) + '</span>'; }
  else { cls = ' past'; acao = '<span class="q">Sem gravação</span>'; }
  return '<div class="ev' + cls + '"><time>' + hora(new Date(ini)) + '</time><div class="tx"><b>' + esc(e.titulo) + '</b><small>' + apoio + '</small></div>' + acao + '</div>';
}

// "Enviar pro Claude": abre o Claude com o pedido já escrito (e deixa o pedido copiado, por garantia).
function pedidoClaude(tipo, titulo, id) {
  const base = CFG.pasta.real || CFG.pasta.caminho;
  const onde = ' da reunião "' + titulo + '" do Goat Meet. A pasta dela é "' + base + '/' + id + '" e o guia está em "' + base + '/_claude/COMO FAZER O RESUMO.md".';
  if (tipo === 'email') return 'Escreve o e-mail de follow-up' + onde;
  if (tipo === 'ajustes') return 'Lista os ajustes pedidos pelo cliente, por ordem de prioridade, a partir' + onde;
  if (tipo === 'time') return 'Manda pro meu time no Slack o resumo' + onde + ' Antes de enviar, me mostra o texto e me pergunta o canal.';
  if (tipo === 'livre') return 'Sobre a reunião "' + titulo + '" do Goat Meet (pasta "' + base + '/' + id + '"): ';

}
async function enviarClaude(id, tipo) {
  if (id === EX) return aviso('Este é só um exemplo.');

function desenharDoca() {
  const el = $('#dock');
  if (S.gravando) {
    el.hidden = false; el.classList.remove('wide');
    el.innerHTML = '<div class="dock-head"><i class="live"></i><span>Gravando</span><span class="sp"></span><time id="clock">' + relogio((Date.now() - S.inicio) / 1000) + '</time></div>'
      + '<div class="meters"><label>Você</label><div class="meter"><i id="nEu"></i></div><label>Chamada</label><div class="meter"><i id="nOutros"></i></div></div>'
      + (S.micOk ? '' : '<div class="warn">Microfone não disponível: sua voz não está entrando na gravação.</div>')
      + '<div class="dock-row"><input id="novoTitulo" placeholder="Nome da reunião (opcional)" spellcheck="false" value="' + esc(S.tituloNovo) + '"><button class="stop" id="parar">Parar</button></div>';
    return;
  }
  if (!S.som) { el.hidden = true; el.innerHTML = ''; return; }
  const ondas = S.som.ondas || [];
  const BARRAS = barrasDaDoca();
  el.classList.toggle('wide', BARRAS > 44);
  let barras = '';
  for (let i = 0; i < BARRAS; i++) {
    const v = ondas.length ? ondas[Math.min(ondas.length - 1, Math.floor(i * ondas.length / BARRAS))] : 0;
    barras += '<i style="height:' + (ondas.length ? Math.round(4 + 24 * Math.min(1, v)) : 6) + 'px"></i>';
  }
  el.hidden = false;
  el.innerHTML = (BARRAS > 44 ? '' : '<div class="dock-head"><span>' + esc(S.som.titulo) + '</span><span class="sp"></span><button class="x" id="fecharSom" title="Fechar">×</button></div>')
    + '<div class="dock-row"><button class="play" id="play">' + (audio.paused ? ICO.play : ICO.pause) + '</button><div class="bar" id="bar">' + barras + '</div>'
    + '<time id="tAgora">' + relogio(S.som.dur) + '</time><button class="speed" id="vel">' + audio.playbackRate + 'x</button></div>';
  progresso();
}
async function ouvir(id, t) {
  if (id === EX) return aviso('O exemplo não tem áudio.');
  const d = S.det && S.det.id === id ? S.det : await chamar('abrir', { id });
  if (!d || !d.id) return;

  if (!S.som || S.som.id !== id) {
    S.som = { id, titulo: d.titulo, dur: d.duracaoSeg, ondas: d.ondas || [] };
    if (d.audio) audio.src = nativo ? id : d.audio;

  if (!d.audio) return;

    const vai = () => { audio.currentTime = t; audio.play(); };

  } else if (audio.paused) audio.play(); else audio.pause();

function progresso() {
  const bar = $('#bar');

    const total = audio.duration || S.som.dur || 0;
    const feitas = total ? Math.round(bar.children.length * audio.currentTime / total) : 0;

  if (ev.target.id === 'novoAviso' && (ev.key === 'Enter' || ev.key === 'Escape')) { const v = Math.round(+ev.target.value), a = CFG.avisos; a.novo = false; if (ev.key === 'Enter' && v >= 1 && v <= 180) { if (!a.opcoes.includes(v)) a.opcoes.push(v); if (!a.antes.includes(v)) a.antes.push(v); guardar('avisos.opcoes', a.opcoes); guardar('avisos.antes', a.antes); } ev.stopPropagation(); return desenharConfig(); }
  if (S.setup) { if (ev.key === 'Enter' && ev.target.id === 'suNome' && S.setup.nome.trim()) acaoSetup('prox'); return; }
  if (S.editar && ev.target.closest && ev.target.closest('#md.edit .ed')) return teclaEdicao(ev);
  if (ev.target.id === 'nomeProj') { if (ev.key === 'Enter') acaoMenu('criar'); if (ev.key === 'Escape') fecharMenu(); return; }
  if (S.menu) { if (ev.key === 'Escape') fecharMenu(); if (ev.key === 'Backspace' || ev.key === 'Delete') { ev.preventDefault(); acaoMenu('apagar'); } return; }
  if (ev.key === 'Escape' && !$('#veil').hidden) return fecharConfig();
  const nomeavel = ev.target.id === 'titulo' || ev.target.id === 'nomeDoProjeto', fv = ev.target.classList && ev.target.classList.contains('fv');
  if ((nomeavel || fv) && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); return; }
  if (nomeavel && ev.key === 'Escape') { ev.target.textContent = ev.target.id === 'titulo' ? S.det.titulo : projeto(S.proj).nome; ev.target.blur(); return; }
  if (fv && ev.key === 'Escape') { ev.target.blur(); return; }
  if (!campo && S.marc.size && !S.sel) {
    if (ev.key === 'Escape') return limparMarc();
    if (ev.key === 'Backspace' || ev.key === 'Delete' || (ev.key === 'Enter' && S.armado)) { ev.preventDefault(); return armarApagar(); }
  }
  if (ev.key === 'Escape' && !campo && (S.sel || S.proj)) return voltar();
  if (ev.key === ' ' && !campo && S.som) { ev.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});
document.addEventListener('focusout', async (ev) => {
  if (ev.target.id === 'novoAviso' && CFG.avisos.novo) { const v = Math.round(+ev.target.value), a = CFG.avisos; a.novo = false; if (v >= 1 && v <= 180) { if (!a.opcoes.includes(v)) a.opcoes.push(v); if (!a.antes.includes(v)) a.antes.push(v); guardar('avisos.opcoes', a.opcoes); guardar('avisos.antes', a.antes); } return desenharConfig(); }
  if (ev.target.id === 'cfgNome') guardar('nome', ev.target.value.trim());
  if (ev.target.classList && ev.target.classList.contains('fv')) return salvarCampo(ev.target);
  if (ev.target.id === 'nomeDoProjeto') { const p = projeto(S.proj), n = ev.target.textContent.trim(); if (!p) return; if (!n) { ev.target.textContent = p.nome; return; } if (n !== p.nome) { p.nome = n; await chamar('salvarProjeto', { id: p.id, nome: n }); } return; }
  if (ev.target.id !== 'titulo' || !S.det) return;
  const novo = ev.target.textContent.trim();
  if (!novo) { ev.target.textContent = S.det.titulo; return; }
  if (novo !== S.det.titulo) { S.det.titulo = novo; await chamar('renomear', { id: S.sel, titulo: novo }); carregarLista(true); }
});
document.addEventListener('paste', (ev) => { const onde = ev.target.nodeType === 1 ? ev.target : ev.target.parentElement; if (onde && onde.closest('#titulo, #nomeDoProjeto, .fv, .ed')) { ev.preventDefault(); document.execCommand('insertText', false, (ev.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ')); } });

// ---------- início ----------
(async function () {
  desenharTopo();
  await carregarConfig();
  const e = await chamar('estado');
  if (e) estado(e);
  await carregarLista(true);
  if (nativo) { const su = await chamar('setup'); if (su && su.precisa) abrirSetup(); }
  if (!nativo) setTimeout(() => mostrarProx({ titulo: 'Alinhamento semanal', inicio: Date.now() + 5 * 60000 }), 1500);
  setInterval(async () => {
    if (document.hidden) return;
    if (nativo && !CFG.pasta.ok) { await carregarConfig(); if (CFG.pasta.ok && !S.sel) desenharCatalogo(); }
    carregarLista();
  }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarLista(); });
})();

// ---------- dados de exemplo (só quando aberto fora do app) ----------
function simulado(cmd, a) {
  const M = simulado.M || (simulado.M = dadosExemplo());
  const P = simulado.P || (simulado.P = [
    { id: 'p2', nome: 'Campanha de lançamento', ficha: { Cliente: 'Incorporadora, via agência', Entrega: 'Filme de lançamento e peças de apoio', Prazo: 'Versão final na quinta' } }
  ]);
  const tarefas = (r) => { const t = String(r.minuta || '').split('\n').filter((l) => RE_TAREFA.test(l)); return [t.filter((l) => l.match(RE_TAREFA)[1] === ' ').length, t.length]; };
  if (cmd === 'listar') return M.map((r) => ({ id: r.id, titulo: r.titulo, inicio: r.inicio, duracaoSeg: r.duracaoSeg, status: r.status, temMinuta: !!r.minuta, resumo: r.resumo, participantes: r.participantes, projeto: r.projeto || null, tarefas: tarefas(r), exemplo: !!r.exemplo }));
  if (cmd === 'projetos') return P.filter((p) => M.some((r) => r.projeto === p.id)).map((p) => ({ id: p.id, nome: p.nome, ficha: Object.assign({}, p.ficha) }));
  if (cmd === 'agrupar') {
    let p = P.find((x) => x.id === a.projeto);
    if (!p) { p = { id: 'p' + Date.now(), nome: a.nome, ficha: {} }; P.push(p); }
    M.forEach((r) => { if (!a.ids.includes(r.id)) return; r.projeto = p.id; const f = fichaDe(r.minuta) || {}; Object.keys(f).forEach((k) => { if (f[k] && !p.ficha[k]) p.ficha[k] = f[k]; }); });
    return { id: p.id };
  }
  if (cmd === 'desagrupar') { M.forEach((r) => { if (a.ids.includes(r.id)) r.projeto = null; }); return {}; }
  if (cmd === 'salvarProjeto') { const p = P.find((x) => x.id === a.id); if (p) { if (a.nome) p.nome = a.nome; if (a.ficha) p.ficha = a.ficha; } return {}; }
  if (cmd === 'apagarProjeto') { M.forEach((r) => { if (r.projeto === a.id) r.projeto = null; }); return {}; }
  if (cmd === 'setup') return { precisa: true, nome: '', perm: { mic: false, tela: false, agenda: false }, pasta: '~/Goat Meet/Meet', modelo: false };
  if (cmd === 'pedirPermissao') return new Promise((ok) => setTimeout(() => ok({ ok: true }), 500));
  if (cmd === 'baixarModelo') { let v = 0; clearInterval(simulado.d); simulado.d = setInterval(() => { v += .012 + Math.random() * .02; if (v >= 1) clearInterval(simulado.d); window.goatEvento({ tipo: 'modelo', p: v, pronto: v >= 1 }); }, 160); return {}; }
  if (cmd === 'abrir') return M.find((r) => r.id === a.id) || null;
  if (cmd === 'salvarResumo') { const r = M.find((x) => x.id === a.id); if (r) { r.minuta = a.texto; const m = a.texto.match(/^>\s?(.*)$/m); if (m) r.resumo = m[1].replace(/\{\?([^}]+)\}/g, '$1'); } return {}; }
  if (cmd === 'escolherPasta') return { caminho: CFG.pasta.caminho.includes('Documents') ? '~/Goat Meet/Meet' : '~/Documents/Trabalho/Meet' };
  if (cmd === 'agenda') {
    const em = (min) => new Date(Date.now() + min * 60000).toISOString();
    const de = (id) => { const r = M.find((x) => x.id === id); return r ? { inicio: r.inicio, fim: new Date(new Date(r.inicio).getTime() + r.duracaoSeg * 1000).toISOString() } : null; };
    const am = (h, m) => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(h, m, 0, 0); return d.toISOString(); };
    return [
      de('a') && Object.assign({ titulo: 'Ajustes do filme', reuniaoId: 'a' }, de('a')),
      { titulo: 'Alinhamento semanal', inicio: em(5), fim: em(35) },
      { titulo: 'Revisão com o cliente', inicio: em(150), fim: em(195) },
      { titulo: 'Apresentação da versão final', inicio: am(10, 0), fim: am(11, 0), amanha: true }
    ].filter(Boolean);
  }
  if (cmd === 'estado') return { gravando: false, inicio: Date.now(), micOk: true };
  if (cmd === 'gravar') { setTimeout(() => window.goatEvento({ tipo: 'estado', gravando: true, inicio: Date.now() - 372000, micOk: true }), 100); simulado.n = setInterval(() => window.goatEvento({ tipo: 'niveis', eu: .25 + Math.random() * .5, outros: .1 + Math.random() * .4 }), 100); return {}; }
  if (cmd === 'parar') { clearInterval(simulado.n); setTimeout(() => window.goatEvento({ tipo: 'estado', gravando: false }), 50); return {}; }
  if (cmd === 'renomear') { M.find((r) => r.id === a.id).titulo = a.titulo; return {}; }
  if (cmd === 'apagar') { simulado.M = M.filter((r) => r.id !== a.id); return {}; }
  if (cmd === 'claude') return { ok: true };
  return {};
}
function dadosExemplo() {
  const h = (dias, hora, min) => { const d = new Date(); d.setDate(d.getDate() - dias); d.setHours(hora, min, 0, 0); return d.toISOString(); };
  let semente = 7; const rnd = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
  const ondas = Array.from({ length: 96 }, (_, i) => Math.max(.08, Math.min(1, .2 + .6 * Math.abs(Math.sin(i / 5.3)) * rnd() + .25 * rnd())));
  const seg = [
    [2, 'outros', 'Bom, pessoal, vamos começar? A ideia hoje é fechar os ajustes do filme antes de mandar para a incorporadora.'],
    [11, 'eu', 'Perfeito. Eu assisti a última versão ontem e anotei três pontos, mas quero ouvir vocês primeiro.'],
    [19, 'outros', 'O principal para a gente é a cena da fachada. O cliente achou a cor do revestimento muito fria, diferente do material aprovado.'],
    [31, 'outros', 'E a trilha. Eles sentiram que o começo está lento, queriam mais energia até a entrada do logo.'],
    [42, 'eu', 'A cor eu consigo ajustar direto no grade, sem re-renderizar. A trilha é que muda o corte: se trocar, eu preciso reeditar os primeiros vinte segundos.'],
    [58, 'outros', 'Quanto tempo isso leva?'],
    [61, 'eu', 'Cor fica pronta amanhã. Com trilha nova, entrego a versão completa na quinta, se a trilha chegar até terça.'],
    [74, 'outros', 'Fechado. A gente manda duas opções de trilha até terça de manhã.'],
    [83, 'outros', 'Só mais uma coisa: a lâmina do lazer na cobertura precisa aparecer antes da piscina, por causa da ordem do book.'],
    [95, 'eu', 'Tranquilo, é só inverter os dois takes. Vou aproveitar e mandar um frame da fachada com a cor nova para aprovação antes de exportar tudo.']
  ].map(([t, quem, texto]) => ({ t, quem, texto }));
  const minuta = [
    '# Ajustes do filme',
    '> Alinhamento da versão 3 do filme. Três ajustes definidos (cor da fachada, trilha e ordem de dois takes) e versão final na quinta, se a trilha chegar até terça.',
    '## Tarefas',
    '- [ ] **Agência** — enviar duas opções de trilha (prazo: 01/12)',
    '- [ ] **Braz** — ajustar a cor da fachada e mandar frame para aprovação (prazo: 26/11) [00:42]',
    '- [ ] **Braz** — inverter os takes de lazer e piscina',
    '- [x] **Braz** — revisar a versão 3 antes da reunião',
    '## Decisões',
    '- Entrega da versão completa na **quinta-feira**',
    '- Um frame da fachada com a cor nova vai para aprovação antes da exportação final',
    '## O que foi falado',
    '### Cor da fachada',
    '- O cliente achou o revestimento frio em relação ao material aprovado [00:19]',
    '- Ajuste será feito no grade, sem novo render [00:42]',
    '- A referência de cor é o material aprovado pela {?Kaza Arquitetura}',
    '### Trilha',
    '- Começo considerado lento; pedem mais energia até a entrada do logo [00:31]',
    '- Trocar a trilha exige reeditar os primeiros 20 segundos',
    '### Ordem das cenas',
    '- Lazer da cobertura deve vir antes da piscina, seguindo a ordem do book [01:23]',
    '## Em aberto',
    '- Quem aprova o frame da fachada: a agência ou direto a incorporadora?'
  ].join('\n');
  const kickoff = [
    '# Kickoff da campanha de lançamento',
    '> Escopo do filme e das peças de apoio, cronograma em três entregas e quem aprova cada etapa. O roteiro fica com a agência; o animatic sai em duas semanas.',
    '## Tarefas',
    '- [ ] **Braz** — entregar o animatic (prazo: 08/12)',
    '- [x] **Agência** — enviar o roteiro',
    '## Decisões',
    '- Três entregas: animatic, versão 1 e versão final',
    '## Em aberto',
    '- Formato vertical entra no escopo?'
  ].join('\n');
  const orc = [
    '# Orçamento das animações de painel',
    '> Proposta por projeto, com duas rodadas de ajuste incluídas. Prazo de 15 dias a partir da aprovação do storyboard.',
    '## Tarefas',
    '- [ ] **Braz** — mandar a proposta por escrito',
    '## Em aberto',
    '- O valor não foi fechado na chamada'
  ].join('\n');
  const base = { segmentos: seg, audio: null, ondas };
  return [
    exemplo(),
    Object.assign({ id: 'a', titulo: 'Ajustes do filme', inicio: h(0, 10, 40), duracaoSeg: 2280, agenda: { tipo: 'criado' }, status: 'pronta', resumo: 'Alinhamento da versão 3 do filme. Três ajustes definidos (cor da fachada, trilha e ordem de dois takes) e versão final na quinta, se a trilha chegar até terça.', participantes: ['Braz', 'Marina Lopes'], minuta, projeto: 'p2' }, base),

  ];
}
